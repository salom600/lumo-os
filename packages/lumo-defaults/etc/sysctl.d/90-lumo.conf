# Lumo OS performance tunables
# zram pairs well with moderate swap pressure
vm.swappiness = 120
vm.vfs_cache_pressure = 50
vm.page-cluster = 0
# responsiveness: stop the NMI watchdog, reduce scheduler noise
kernel.nmi_watchdog = 0
kernel.sched_autogroup_enabled = 1
# network fine defaults
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
