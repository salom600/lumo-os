# Copy the live system onto the target disk.
# Debian live-boot mounts the ISO at /run/live/medium (also /lib/live/mount/medium).
unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/lib/live/mount/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
