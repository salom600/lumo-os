# Calamares settings for Lumo OS
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - shellprocess-lumo-finalize
      - umount
  - show:
      - finished

branding: lumo
prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
