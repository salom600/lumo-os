# Lumo OS automated-test serial console (CI only).
# With lumo.test=1 on the kernel command line, ttyS0 becomes a root
# auto-login shell so the CI driver can validate the boot end-to-end
# without depending on any runtime bootstrap. Normal boots are untouched
# (the condition makes this drop-in inert).
[Unit]
ConditionKernelCommandLine=lumo.test=1

[Service]
ExecStart=
ExecStart=-/sbin/agetty -a root -L -8 ttyS0 115200 vt100
Restart=always
